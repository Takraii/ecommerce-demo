function packById(id){for(const o of db.orders){const p=o.packages.find(x=>x.id===id);if(p)return {order:o,pkg:p};}return null;}
function allPrinted(o){return o.packages.length>0&&o.packages.every(p=>p.labelPrinted);}
function allHanded(o){return o.packages.length>0&&o.packages.every(p=>p.handedAt);}
function status(o){if(!o.paidAt)return 'รอชำระเงิน';return allHanded(o)?'ส่งให้ขนส่งแล้ว':'กำลังเตรียมสินค้า';}
function statusChip(o){const s=status(o);return `<span class="chip ${s==='รอชำระเงิน'?'orange':s==='ส่งให้ขนส่งแล้ว'?'green':'blue'}">${s}</span>`;}
function labelChip(o){if(!o.paidAt)return '<span class="chip grey">ยังไม่ชำระเงิน</span>';const n=o.packages.filter(p=>p.labelPrinted).length;return n===o.packages.length?'<span class="chip green">พิมพ์ครบแล้ว</span>':`<span class="chip ${n?'orange':'red'}">${n?'พิมพ์ '+n+'/'+o.packages.length+' กล่อง':'ยังไม่พิมพ์'}</span>`;}
function subtotalCart(){return Object.entries(db.cart).reduce((s,[id,qty])=>s+(productById(id)?.price||0)*qty,0);}
function qtyCart(){return Object.values(db.cart).reduce((s,q)=>s+Number(q),0);}
function shipFee(subtotal,count){const a=db.settings;if(!count)return 0;if(a.mode==='quantity')return count*a.perItem;if(a.mode==='free'&&subtotal>=a.freeThreshold)return 0;return a.flat;}
function shippingInfo(){const s=db.settings;return s.mode==='quantity'?`${baht(s.perItem)} / หน่วยขาย`:s.mode==='free'?`ฟรีเมื่อซื้อครบ ${baht(s.freeThreshold)} (ปกติ ${baht(s.flat)})`:`ราคาคงที่ ${baht(s.flat)}`;}
const paidOrders=()=>db.orders.filter(o=>!!o.paidAt);
const alertOrders=()=>db.orders.filter(o=>o.paidAt&&fmtHours(o.paidAt)>48&&!o.packages.some(p=>p.labelPrinted));
const partialOrders=()=>db.orders.filter(o=>o.paidAt&&o.packages.some(p=>p.labelPrinted)&&!allPrinted(o));
const pendingLabels=()=>db.orders.filter(o=>o.paidAt&&!allPrinted(o));
function art(p,cls=''){if(!p)return '';const index=db.products.findIndex(x=>x.id===p.id);return `<div class="product-art art${Math.max(0,index)%5} ${cls}"><span class="shape"></span><span class="art-emoji">${esc(p.emoji||'📦')}</span>${p.image?`<img src="${esc(p.image)}" alt="${esc(p.name)}">`:''}</div>`;}
function moneyLine(label,value,strong=false){return `<div class="summary-line ${strong?'summary-total':''}"><span>${esc(label)}</span><strong>${baht(value)}</strong></div>`;}
function toast(message,type='success'){const root=document.getElementById('toast-root');if(!root)return;const el=document.createElement('div');el.className='toast '+(type==='error'?'error':type==='info'?'info':'');el.textContent=message;root.appendChild(el);setTimeout(()=>el.remove(),4000);}
function freshRender(scroll=true){render();if(scroll)window.scrollTo({top:0,behavior:'instant'});}
function saveRender(message='',scroll=false){persist();freshRender(scroll);if(message)toast(message);}
function nav(role,view){ui.role=role;if(role==='admin')ui.adminView=view||'dashboard';else ui.customerView=view||'home';ui.modal=null;freshRender(true);}
const adminMenus=[['dashboard','แดชบอร์ด','grid'],['products','จัดการสินค้า','bag'],['categories','หมวดหมู่สินค้า','tag'],['orders','คำสั่งซื้อ','list'],['new-order','สร้างคำสั่งซื้อ','plus'],['customers','ข้อมูลลูกค้า','phone'],['labels','พิมพ์ใบปะหน้า','printer'],['scan','สแกนส่งมอบขนส่ง','scan'],['reports','รายงาน','chart'],['shipping','ตั้งค่าค่าจัดส่ง','settings']];
function header(){const cust=ui.role==='customer';return `<div class="demo-top"><span class="demo-dot"></span> ระบบสาธิตเท่านั้น · ไม่เชื่อมต่อการชำระเงินจริงหรือบริษัทขนส่ง · ข้อมูลจำลองบันทึกในเบราว์เซอร์เครื่องนี้</div>
<header class="main-header"><div class="header-inner"><div class="brand" data-a="nav" data-role="customer" data-view="home"><div class="brand-icon">🌿</div><div><div class="brand-name">บ้านสินค้าดี</div><div class="brand-sub">GOOD THINGS, EVERY DAY</div></div></div>
${cust?`<nav class="header-nav" aria-label="เมนูลูกค้า"><button class="nav-link ${ui.customerView==='home'?'active':''}" data-a="nav" data-role="customer" data-view="home">หน้าแรก</button><button class="nav-link ${['products','detail'].includes(ui.customerView)?'active':''}" data-a="nav" data-role="customer" data-view="products">สินค้าทั้งหมด</button><button class="nav-link ${ui.customerView==='lookup'?'active':''}" data-a="nav" data-role="customer" data-view="lookup">ตรวจสอบคำสั่งซื้อ</button></nav>`:'<div style="flex:1"></div>'}
<div class="header-actions">${cust?`<button class="cart-bubble" data-a="nav" data-role="customer" data-view="cart">${i('cart')} <span class="cart-word">ตะกร้า</span> <span class="count">${qtyCart()}</span></button>`:''}
<div class="switcher" aria-label="เปลี่ยนระบบ"><button class="${cust?'active':''}" data-a="nav" data-role="customer" data-view="home">${i('store','sm')} ลูกค้า</button><button class="${!cust?'active':''}" data-a="nav" data-role="admin" data-view="dashboard">${i('grid','sm')} หลังบ้าน</button></div></div></div></header>`;}
function footer(){return `<footer class="footer"><span>© บ้านสินค้าดี · Interactive Demo สำหรับนำเสนอแนวคิดระบบ</span><span>สินค้า ออร์เดอร์ และเลขติดตามทั้งหมดเป็นข้อมูลตัวอย่าง</span></footer>`;}
function render(){const app=document.getElementById('app');app.innerHTML=header()+(ui.role==='customer'?customerApp():adminApp());document.getElementById('modal-root').innerHTML=renderModal();const pr=document.getElementById('print-root');if(ui.modal==='label'){const o=orderById(ui.modalId);pr.innerHTML=o?labelsMarkup(o,ui.modalPkg?[ui.modalPkg]:o.packages.map(p=>p.id)):'';}else pr.innerHTML='';if(ui.role==='admin'&&ui.adminView==='scan'&&ui.modal===null){setTimeout(()=>document.getElementById('scan-input')?.focus(),0);}}
function customerApp(){let inner='';switch(ui.customerView){case'home':inner=homePage();break;case'products':inner=catalogPage();break;case'detail':inner=productDetailPage();break;case'cart':inner=cartPage();break;case'checkout':inner=checkoutPage();break;case'lookup':inner=lookupPage();break;case'success':inner=successPage();break;default:inner=homePage();}return `<main class="container">${inner}${footer()}</main>`;}
function homePage(){return `<section class="hero"><div class="hero-copy"><span class="hero-kicker">✦ คัดสรรสิ่งดี ๆ เพื่อทุกวันของคุณ</span><h1>เรื่องง่าย ๆ ที่ทำให้<br>ทุกวันมีความสุข</h1><p>ของใช้ประจำวัน อาหาร และของขวัญที่เลือกมาอย่างใส่ใจ ชอปง่าย ส่งตรงถึงบ้าน</p><button class="btn" data-a="nav" data-role="customer" data-view="products">เลือกชมสินค้า ${i('arrow')}</button></div><div class="hero-art">🛍️</div></section>
<div class="feature-row"><div class="feature"><span class="feature-icon">${i('check','lg')}</span><div><strong>คัดสรรคุณภาพ</strong><p>สินค้าที่ตั้งใจเลือกมาให้คุณ</p></div></div><div class="feature"><span class="feature-icon">${i('truck','lg')}</span><div><strong>จัดส่งทั่วไทย</strong><p>ส่งมอบผ่านบริษัทขนส่งภายนอก</p></div></div><div class="feature"><span class="feature-icon">${i('phone','lg')}</span><div><strong>เช็กออร์เดอร์ง่าย</strong><p>ใช้เบอร์โทร ไม่ต้องสมัครสมาชิก</p></div></div></div>
<div class="section-header"><div><h2>เลือกชอปตามหมวดหมู่</h2><div class="muted mt8">ค้นหาสิ่งที่ใช่ในไม่กี่คลิก</div></div></div>
<div class="category-grid">${db.categories.map(c=>`<button class="category-card" data-a="category-go" data-id="${esc(c.id)}"><span class="category-emoji">${esc(c.emoji||'📦')}</span><h3>${esc(c.name)}</h3><small>${db.products.filter(p=>p.active&&p.categoryId===c.id).length} รายการ</small></button>`).join('')}</div>
<section style="margin-top:38px"><div class="section-header"><div><h2>สินค้ายอดนิยม</h2><div class="muted mt8">เริ่มต้นเลือกซื้อได้เลย</div></div><button class="btn outline sm" data-a="nav" data-role="customer" data-view="products">ดูทั้งหมด ${i('arrow','sm')}</button></div>
${productCards(db.products.filter(p=>p.active).slice(0,8))}</section>`;}
function productCards(ps){return ps.length?`<div class="product-grid">${ps.map(p=>`<article class="product-card"><div role="button" tabindex="0" data-a="detail" data-id="${esc(p.id)}">${art(p)}</div><div class="product-body"><div class="product-category">${esc(catName(p.categoryId))}</div><div class="product-name" data-a="detail" data-id="${esc(p.id)}">${esc(p.name)}</div><div class="product-bottom"><div class="product-price">${baht(p.price)} <span class="small muted" style="font-weight:400">/ ${esc(p.unit)}</span></div><button class="btn soft sm" data-a="add-cart" data-id="${esc(p.id)}">${i('plus','sm')} เพิ่ม</button></div></div></article>`).join('')}</div>`:`<div class="empty"><div class="symbol">🔎</div>ไม่พบสินค้าที่ตรงกับการค้นหา</div>`;}
function catalogPage(){const q=ui.listingSearch.trim().toLowerCase();const ps=db.products.filter(p=>p.active&&(ui.listingCategory==='all'||p.categoryId===ui.listingCategory)&&(!q||p.name.toLowerCase().includes(q)||p.description.toLowerCase().includes(q)));return `<div class="section-header"><div><h1 class="page-title">สินค้าทั้งหมด</h1><p class="page-subtitle">เลือกสินค้าที่คุณชอบ แล้วเพิ่มลงตะกร้าได้ทันที</p></div><span class="chip">${ps.length} รายการ</span></div>
<div class="filter-bar"><form data-form="catalog-search" class="searchbox"><span>${i('search')}</span><input id="catalog-q" placeholder="ค้นหาชื่อสินค้า..." value="${esc(ui.listingSearch)}"></form><select id="catalog-cat" data-change="catalog-cat"><option value="all">ทุกหมวดหมู่</option>${db.categories.map(c=>`<option value="${esc(c.id)}" ${ui.listingCategory===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select><span class="muted small">กด Enter เพื่อค้นหา</span></div>${productCards(ps)}`;}
function productDetailPage(){const p=productById(ui.productId);if(!p||!p.active)return `<div class="empty">ไม่พบสินค้านี้ <button class="btn primary" data-a="nav" data-role="customer" data-view="products">กลับไปดูสินค้า</button></div>`;return `<div class="crumbs"><button data-a="nav" data-role="customer" data-view="home">หน้าแรก</button> › <button data-a="nav" data-role="customer" data-view="products">สินค้า</button> › ${esc(p.name)}</div><div class="detail-layout"><div>${art(p,'detail')}</div><div class="detail-info"><span class="chip green">${esc(catName(p.categoryId))}</span><h1>${esc(p.name)}</h1><div class="price">${baht(p.price)} <span class="small muted" style="font-weight:400">/ ${esc(p.unit)}</span></div><p>${esc(p.description||'สินค้าคุณภาพจากบ้านสินค้าดี')}</p><div class="divider"></div><div class="flex wrap"><strong>จำนวน (${esc(p.unit)})</strong><div class="qty"><button data-a="detail-qty" data-delta="-1" aria-label="ลดจำนวน">−</button><strong>${ui.detailQty}</strong><button data-a="detail-qty" data-delta="1" aria-label="เพิ่มจำนวน">+</button></div></div><div class="flex wrap mt18"><button class="btn primary wide" data-a="add-cart" data-id="${esc(p.id)}" data-qty="detail">${i('cart')} เพิ่มลงตะกร้า</button><button class="btn outline" data-a="nav" data-role="customer" data-view="products">เลือกสินค้าอื่น</button></div><div class="notice mt18 small">${i('truck','sm')} ค่าจัดส่ง: ${esc(shippingInfo())}</div></div></div>`;}
function cartEntries(){return Object.entries(db.cart).filter(([id,q])=>q>0&&productById(id)).map(([id,qty])=>({p:productById(id),qty}));}
function cartPage(){const entries=cartEntries();if(!entries.length)return `<div class="section-header"><div><h1 class="page-title">ตะกร้าสินค้า</h1><p class="page-subtitle">รายการที่คุณเลือกไว้</p></div></div><div class="empty"><div class="symbol">🛒</div><h3>ตะกร้าของคุณยังว่างอยู่</h3><p>เลือกสินค้าที่ถูกใจและกลับมาชำระเงินได้ที่นี่</p><button class="btn primary" data-a="nav" data-role="customer" data-view="products">เลือกซื้อสินค้า</button></div>`;
const subtotal=subtotalCart(),shipping=shipFee(subtotal,qtyCart());return `<div class="section-header"><div><h1 class="page-title">ตะกร้าสินค้า</h1><p class="page-subtitle">${number(qtyCart())} หน่วยขาย จาก ${entries.length} รายการ</p></div><button class="btn ghost" data-a="nav" data-role="customer" data-view="products">${i('plus')} ซื้อสินค้าเพิ่ม</button></div><div class="cart-layout"><div class="card">${entries.map(({p,qty})=>`<div class="cart-row">${art(p,'compact')}<div style="flex:1;min-width:0"><strong>${esc(p.name)}</strong><div class="small muted mt8">${baht(p.price)} / ${esc(p.unit)}</div><div class="flex wrap mt8"><div class="qty"><button data-a="cart-qty" data-id="${esc(p.id)}" data-delta="-1">−</button><strong>${qty}</strong><button data-a="cart-qty" data-id="${esc(p.id)}" data-delta="1">+</button></div><button class="btn ghost sm danger-text" data-a="cart-remove" data-id="${esc(p.id)}">${i('trash','sm')} ลบ</button></div></div><strong>${baht(p.price*qty)}</strong></div>`).join('')}</div><div class="card"><h3 class="card-title">สรุปคำสั่งซื้อ</h3>${moneyLine('ราคาสินค้า',subtotal)}${moneyLine('ค่าจัดส่ง',shipping)}<div class="muted small">${esc(shippingInfo())}</div>${moneyLine('ยอดรวมทั้งหมด',subtotal+shipping,true)}<button class="btn primary block mt18" data-a="nav" data-role="customer" data-view="checkout">ไปที่ชำระเงิน ${i('arrow')}</button><div class="small muted mt12 t-center">ขั้นตอนนี้เป็นการสั่งซื้อจำลอง</div></div></div>`;}
function checkoutPage(){const entries=cartEntries();if(!entries.length){return `<div class="empty">ไม่มีสินค้าในตะกร้า <button class="btn primary" data-a="nav" data-role="customer" data-view="products">เลือกสินค้า</button></div>`;}const subtotal=subtotalCart(),shipping=shipFee(subtotal,qtyCart());return `<div class="section-header"><div><h1 class="page-title">ข้อมูลจัดส่งและชำระเงิน</h1><p class="page-subtitle">กรอกข้อมูลเพื่อสร้างคำสั่งซื้อจำลอง</p></div></div><form data-form="checkout" id="checkout-form"><div class="checkout-layout"><div class="stack" style="gap:19px"><div class="card"><h3 class="card-title">${i('truck')} ที่อยู่สำหรับจัดส่ง</h3><div class="field-grid"><div class="field"><label for="check-name">ชื่อ–นามสกุลผู้รับ *</label><input id="check-name" name="name" placeholder="ชื่อผู้รับสินค้า" required minlength="2"></div><div class="field"><label for="check-phone">เบอร์โทรศัพท์ *</label><input id="check-phone" name="phone" required inputmode="numeric" pattern="0[0-9]{8,9}" title="กรุณาใส่เบอร์มือถือ 9–10 หลัก ขึ้นต้นด้วย 0" placeholder="0812345678"></div><div class="field span2"><label for="check-address">ที่อยู่จัดส่ง *</label><textarea id="check-address" name="address" required placeholder="บ้านเลขที่ ถนน แขวง/ตำบล เขต/อำเภอ"></textarea></div><div class="field"><label>จังหวัด *</label><input name="province" placeholder="เช่น กรุงเทพมหานคร" required></div><div class="field"><label>รหัสไปรษณีย์ *</label><input name="postcode" placeholder="10110" required pattern="[0-9]{5}" inputmode="numeric"></div><div class="field span2"><label>หมายเหตุ (ถ้ามี)</label><input name="note" placeholder="เช่น ติดต่อก่อนจัดส่ง"></div></div></div><div class="card"><h3 class="card-title">${i('credit')} วิธีชำระเงิน</h3><label class="payment-option"><input type="radio" name="paymentMethod" value="โอนเงินผ่านธนาคาร" checked><div><strong>โอนเงินผ่านธนาคาร</strong><div class="small muted">ตัวอย่างบัญชี: xxx-x-xxxxx-x (ไม่ใช่บัญชีจริง)</div></div></label><label class="payment-option"><input type="radio" name="paymentMethod" value="พร้อมเพย์"><div><strong>พร้อมเพย์ (PromptPay)</strong><div class="small muted">จำลองการเลือกช่องทางชำระเงิน ไม่ทำรายการเงินจริง</div></div></label><div class="notice amber small">เมื่อยืนยันคำสั่งซื้อ ระบบจะเริ่มที่สถานะ “รอชำระเงิน” จากนั้นให้ไปที่ Admin เพื่อกดยืนยันการชำระเงิน</div></div></div><aside class="card"><h3 class="card-title">รายการสินค้า (${qtyCart()} หน่วยขาย)</h3>${entries.map(({p,qty})=>`<div class="flex between" style="margin:13px 0"><span class="muted">${esc(p.name)} × ${qty} ${esc(p.unit)}</span><strong>${baht(p.price*qty)}</strong></div>`).join('')}<div class="divider"></div>${moneyLine('ราคาสินค้า',subtotal)}${moneyLine('ค่าจัดส่ง',shipping)}${moneyLine('ยอดชำระทั้งหมด',subtotal+shipping,true)}<button type="submit" class="btn primary block mt18">${i('check')} ยืนยันคำสั่งซื้อ</button><button type="button" class="btn ghost block mt8" data-a="nav" data-role="customer" data-view="cart">กลับไปตะกร้า</button><div class="muted tiny mt12">* เว็บไซต์จำลอง ไม่มีการตัดเงินจริง</div></aside></div></form>`;}
function successPage(){const o=orderById(ui.checkoutDone);if(!o)return homePage();return `<div class="success-card"><div class="checkmark">✓</div><h1 class="page-title">สร้างคำสั่งซื้อเรียบร้อย</h1><p class="muted">ขอบคุณที่สั่งซื้อกับบ้านสินค้าดี</p><div class="card flat mt18"><div class="small muted">เลขคำสั่งซื้อ</div><h2 style="font-size:27px;color:var(--green);margin:7px">${esc(o.id)}</h2>${statusChip(o)}<div class="divider"></div>${moneyLine('ยอดรวม',o.total)}<p class="muted small">ติดตามคำสั่งซื้อได้ด้วยเบอร์โทร ${esc(o.customer.phone)}</p></div><div class="flex wrap mt18" style="justify-content:center"><button class="btn primary" data-a="lookup-new" data-phone="${esc(o.customer.phone)}">ตรวจสอบคำสั่งซื้อ ${i('arrow')}</button><button class="btn outline" data-a="nav" data-role="customer" data-view="products">เลือกซื้อสินค้าเพิ่ม</button></div></div>`;}

function lookupItem(o){const expanded=ui.lookupExpanded===o.id,shipped=o.packages.filter(p=>p.handedAt);return `<div class="order-lookup-item"><div class="flex between wrap"><div><strong style="font-size:17px">${esc(o.id)}</strong><div class="small muted mt8">สั่งซื้อ ${dThai(o.createdAt,true)}</div></div><div class="t-right">${statusChip(o)}<div class="mt8"><strong>${baht(o.total)}</strong></div></div></div>${expanded?`<div class="status-steps"><div class="status-step ${o.paidAt?'done':'current'}">รอชำระเงิน</div><div class="status-step ${o.paidAt?(allHanded(o)?'done':'current'):''}">กำลังเตรียมสินค้า</div><div class="status-step ${allHanded(o)?'current':''}">ส่งให้ขนส่งแล้ว</div></div><div class="divider"></div><h4 style="margin:7px 0">รายการสินค้า</h4>${o.items.map(x=>`<div class="flex between small mt8"><span>${esc(x.name)} × ${x.qty} ${esc(x.unit)}</span><strong>${baht(x.qty*x.price)}</strong></div>`).join('')}${shipped.length?`<div class="divider"></div><h4>ข้อมูลติดตามพัสดุ (${shipped.length} กล่อง)</h4>${shipped.map(p=>`<div class="flex between wrap mt8"><div><div class="small muted">${esc(p.id)}</div><strong>${esc(p.tracking||'')}</strong><div class="small muted">${esc(p.courier||'')}</div></div><a class="btn outline sm" target="_blank" rel="noopener noreferrer" href="${esc(carrierLinks[p.courier]||'#')}">ตรวจสอบกับขนส่ง ${i('arrow','sm')}</a></div>`).join('')}`:''}${!shipped.length?'<p class="muted small">จะแสดงเลขติดตามพัสดุเมื่อมีการส่งมอบกล่องให้ขนส่งแล้ว</p>':''}`:''}<div class="flex between mt12"><span class="muted small">${o.items.reduce((s,x)=>s+x.qty,0)} หน่วยขาย</span><button class="btn outline sm" data-a="lookup-expand" data-id="${esc(o.id)}">${i('eye','sm')} ${expanded?'ซ่อนรายละเอียด':'ดูรายละเอียด'}</button></div></div>`;}

 return filterOK&&(ui.sourceFilter==='all'||o.source===ui.sourceFilter)&&(!q||String(o.externalRef||'').toLowerCase().includes(q)||o.id.toLowerCase().includes(q)||o.customer.name.toLowerCase().includes(q)||o.customer.phone.includes(q)||o.packages.some(p=>p.tracking?.toLowerCase().includes(q)));
});}

function periods(){const t=new Date();function localDayKey(d){return [d.getFullYear(),p2(d.getMonth()+1),p2(d.getDate())].join('-');}const out=[];
 if(ui.reportPeriod==='daily'){for(let n=6;n>=0;n--){let d=new Date(t.getFullYear(),t.getMonth(),t.getDate()-n);out.push({key:localDayKey(d),name:new Intl.DateTimeFormat('th-TH',{day:'numeric',month:'short'}).format(d),from:d,to:new Date(d.getFullYear(),d.getMonth(),d.getDate()+1)});}}
 else if(ui.reportPeriod==='weekly'){let monday=new Date(t.getFullYear(),t.getMonth(),t.getDate()-((t.getDay()+6)%7));for(let n=7;n>=0;n--){let from=new Date(monday.getFullYear(),monday.getMonth(),monday.getDate()-7*n);out.push({key:localDayKey(from),name:new Intl.DateTimeFormat('th-TH',{day:'numeric',month:'short'}).format(from),from,to:new Date(from.getFullYear(),from.getMonth(),from.getDate()+7)});}}
 else{for(let n=5;n>=0;n--){let from=new Date(t.getFullYear(),t.getMonth()-n,1);out.push({key:localDayKey(from),name:new Intl.DateTimeFormat('th-TH',{month:'short',year:'2-digit'}).format(from),from,to:new Date(from.getFullYear(),from.getMonth()+1,1)});}}
 return out;}

// Printable Code 39: self-contained barcode encoding (no external library or network needed).
const code39={
'0':'nnnwwnwnn','1':'wnnwnnnnw','2':'nnwwnnnnw','3':'wnwwnnnnn','4':'nnnwwnnnw','5':'wnnwwnnnn','6':'nnwwwnnnn','7':'nnnwnnwnw','8':'wnnwnnwnn','9':'nnwwnnwnn',
'A':'wnnnnwnnw','B':'nnwnnwnnw','C':'wnwnnwnnn','D':'nnnnwwnnw','E':'wnnnwwnnn','F':'nnwnwwnnn','G':'nnnnnwwnw','H':'wnnnnwwnn','I':'nnwnnwwnn','J':'nnnnwwwnn',
'K':'wnnnnnnww','L':'nnwnnnnww','M':'wnwnnnnwn','N':'nnnnwnnww','O':'wnnnwnnwn','P':'nnwnwnnwn','Q':'nnnnnnwww','R':'wnnnnnwwn','S':'nnwnnnwwn','T':'nnnnwnwwn',
'U':'wwnnnnnnw','V':'nwwnnnnnw','W':'wwwnnnnnn','X':'nwnnwnnnw','Y':'wwnnwnnnn','Z':'nwwnwnnnn','-':'nwnnnnwnw','.':'wwnnnnwnn',' ':'nwwnnnwnn','$':'nwnwnwnnn','/':'nwnwnnnwn','+':'nwnnnwnwn','%':'nnnwnwnwn','*':'nwnnwnwnn'};
function barcodeSVG(value){const code='*'+String(value).toUpperCase()+'*';let x=18,rects='';for(const char of code){const patt=code39[char];if(!patt)continue;for(let j=0;j<patt.length;j++){const width=patt[j]==='w'?5:2;if(j%2===0)rects+=`<rect x="${x}" y="0" width="${width}" height="66" />`;x+=width;}x+=3;}const width=x+18;return `<svg class="barcode-graphic" viewBox="0 0 ${width} 66" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" role="img" aria-label="บาร์โค้ด ${esc(value)}"><rect width="${width}" height="66" fill="#fff"/><g fill="#111">${rects}</g></svg>`;}
function labelMarkup(o,p){return `<section class="label-card"><div class="label-top"><div><div class="label-brand">บ้านสินค้าดี</div><div class="small">ใบปะหน้าเตรียมส่งสินค้า</div></div><div class="t-right"><strong style="font-size:15px">${esc(o.id)}</strong><div class="small">กล่อง ${o.packages.findIndex(x=>x.id===p.id)+1} / ${o.packages.length}</div></div></div>
<div style="text-align:center;margin:10px 0"><div class="small">PACKAGE ID / INTERNAL BARCODE</div>${barcodeSVG(p.id)}<div class="barcode-caption">${esc(p.id)}</div></div><div class="label-address"><div><div class="small muted">ผู้รับสินค้า</div><strong>${esc(o.customer.name)}</strong><div>${esc(o.customer.phone)}</div></div><div><div class="small muted">ที่อยู่จัดส่ง</div><strong>${esc(o.customer.address)}</strong><div>${esc(o.customer.province)} ${esc(o.customer.postcode)}</div></div></div>
<div class="label-items"><strong>รายการสินค้า</strong><table class="label-table"><thead><tr><th>สินค้า</th><th style="text-align:right">จำนวน</th></tr></thead><tbody>${o.items.map(x=>`<tr><td>${esc(x.name)}</td><td style="text-align:right">${x.qty} ${esc(x.unit)}</td></tr>`).join('')}</tbody></table></div>${o.note?`<div class="label-notes"><strong>หมายเหตุ: </strong>${esc(o.note)}</div>`:''}</section>`;}

${o.note?`<div class="notice blue mt18">หมายเหตุ: ${esc(o.note)}</div>`:''}`,true);}
function productModal(){const p=ui.modalId?productById(ui.modalId):null;return modalWrap(p?'แก้ไขสินค้า':'เพิ่มสินค้าใหม่',`<form data-form="product"><div class="field-grid"><div class="field span2"><label>ชื่อสินค้า *</label><input name="name" value="${esc(p?.name||'')}" required maxlength="120" placeholder="เช่น ชุดของขวัญ"></div><div class="field"><label>ราคาต่อหน่วย (บาท) *</label><input name="price" type="number" min="0" step="0.01" required value="${p?.price??''}"></div><div class="field"><label>หน่วยสินค้า *</label><input name="unit" required maxlength="40" value="${esc(p?.unit||'ชิ้น')}" placeholder="เช่น ขวด, แพ็ก, กิโลกรัม"><div class="tiny muted">พิมพ์หน่วยที่ต้องการได้เอง</div></div><div class="field span2"><label>หมวดหมู่ *</label><select name="categoryId" required>${db.categories.map(c=>`<option value="${esc(c.id)}" ${p?.categoryId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>อีโมจิสินค้า (ถ้าไม่อัปโหลดรูป)</label><input name="emoji" value="${esc(p?.emoji||'📦')}" maxlength="8" placeholder="📦"></div><div class="field"><label>รูปภาพสินค้า (ไม่บังคับ)</label><input type="file" name="image" accept="image/png,image/jpeg,image/webp,image/gif"><div class="tiny muted">เพื่อเก็บใน Browser แนะนำไฟล์ไม่เกิน 1 MB</div></div><div class="field span2"><label>รายละเอียดสินค้า</label><textarea name="description" placeholder="เขียนรายละเอียดสั้น ๆ">${esc(p?.description||'')}</textarea></div><div class="field span2"><label style="display:flex;gap:9px;align-items:center"><input type="checkbox" name="active" ${!p||p.active?'checked':''}> เปิดขายสินค้านี้</label>${p?.image?`<label style="display:flex;gap:9px;align-items:center"><input type="checkbox" name="removeImage"> ลบภาพที่อัปโหลดไว้และกลับไปใช้ภาพตัวอย่าง</label>`:''}</div></div><div class="modal-actions"><button type="button" class="btn outline" data-a="close-modal">ยกเลิก</button><button type="submit" class="btn primary">${i('check')} บันทึกสินค้า</button></div></form>`,false);}

function labelModal(){const o=orderById(ui.modalId);if(!o)return '';const ps=ui.modalPkg?o.packages.filter(p=>p.id===ui.modalPkg):o.packages;return modalWrap('ตัวอย่างใบปะหน้า · '+esc(o.id),`<div class="notice blue small" style="margin-bottom:15px">ฉลากนี้เป็นบาร์โค้ด Code 39 ของ Package ID ภายในร้าน ไม่ใช่บาร์โค้ด Tracking ของขนส่ง · พิมพ์ซ้ำจะไม่เปลี่ยนรหัสเดิม</div><div class="flex between wrap" style="margin-bottom:12px"><strong>แสดง ${ps.length} กล่อง</strong><span class="small muted">${ps.filter(p=>p.labelPrinted).length}/${ps.length} กล่องที่ยืนยันพิมพ์แล้ว</span></div>${labelsMarkup(o,ps.map(p=>p.id))}<div class="notice amber small">${i('alert')} การกดพิมพ์ไม่ยืนยันว่ากระดาษออกจริง กรุณากด “ยืนยันพิมพ์เรียบร้อย” หลังตรวจสอบเครื่องพิมพ์แล้ว</div><div class="modal-actions"><button class="btn outline" data-a="close-modal">ปิด</button><button class="btn outline" data-a="print-label">${i('printer')} Print / พิมพ์</button><button class="btn primary" data-a="confirm-label" data-id="${esc(o.id)}">${i('check')} ยืนยันพิมพ์เรียบร้อย (${ps.length} กล่อง)</button></div>`,true);}
function confirmProductDeleteModal(){const p=productById(ui.modalId);return p?modalWrap('ยืนยันลบสินค้า',`<p>ลบ <strong>${esc(p.name)}</strong> ออกจากรายการสินค้า?</p><div class="notice amber small">ออร์เดอร์เก่าจะยังแสดงชื่อและราคาตามเวลาที่ลูกค้าสั่งซื้อไว้</div><div class="modal-actions"><button class="btn outline" data-a="close-modal">ยกเลิก</button><button class="btn danger" data-a="delete-product-now" data-id="${esc(p.id)}">ลบสินค้า</button></div>`):'';}
function confirmCategoryDeleteModal(){const c=db.categories.find(x=>x.id===ui.modalId);return c?modalWrap('ยืนยันลบหมวดหมู่',`<p>ต้องการลบหมวดหมู่ <strong>${esc(c.name)}</strong> หรือไม่?</p><p class="small muted">ลบได้เฉพาะหมวดหมู่ที่ยังไม่มีสินค้าผูกอยู่</p><div class="modal-actions"><button class="btn outline" data-a="close-modal">ยกเลิก</button><button class="btn danger" data-a="delete-category-now" data-id="${esc(c.id)}">ลบหมวดหมู่</button></div>`):'';}
function openModal(kind,id=null,pkg=null){ui.modal=kind;ui.modalId=id;ui.modalPkg=pkg;render();}
function confirmPayment(id){const o=orderById(id);if(!o)return;if(o.paidAt){toast('คำสั่งซื้อนี้ยืนยันชำระเงินแล้ว','info');return;}o.paidAt=new Date().toISOString();ui.modal='order';saveRender('ยืนยันชำระเงินแล้ว · ลูกค้าเห็นสถานะกำลังเตรียมสินค้า');}
function updatePackages(id){const o=orderById(id),input=document.getElementById('package-count');if(!o||!input)return;const n=Number(input.value);if(!Number.isInteger(n)||n<1||n>20){toast('จำนวนกล่องต้องเป็นจำนวนเต็ม 1–20','error');return;}if(o.packages.some(p=>p.labelPrinted||p.handedAt)){toast('เปลี่ยนจำนวนกล่องไม่ได้หลังเริ่มพิมพ์ใบปะหน้าหรือส่งมอบแล้ว','error');return;}
 o.packages=Array.from({length:n},(_,j)=>({id:o.id+'-P'+p2(j+1),labelPrinted:false,tracking:null,courier:null,handedAt:null}));saveRender('บันทึกจำนวนกล่อง '+n+' กล่องแล้ว');}
function confirmPrinted(id){const o=orderById(id);if(!o?.paidAt)return toast('ยังไม่ยืนยันการชำระเงิน','error');const ids=ui.modalPkg?[ui.modalPkg]:o.packages.map(p=>p.id);for(const p of o.packages)if(ids.includes(p.id))p.labelPrinted=true;ui.modal='order';ui.modalId=o.id;ui.modalPkg=null;saveRender('บันทึกสถานะ “พิมพ์ใบปะหน้าแล้ว” '+ids.length+' กล่อง');}
function scanError(msg){ui.scanError=msg;render();toast(msg,'error');}
function applyScan(input){const raw=String(input??'').trim().toUpperCase();if(!raw)return scanError('กรุณาระบุรหัสบาร์โค้ด');
 if(ui.scanStage==='internal'){
  if(!/^ORD-\d+-P\d{2,}$/.test(raw))return scanError('ต้องสแกนบาร์โค้ดภายใน (Package ID) ก่อน เช่น ORD-1002-P01');
  if(ui.scanDraft.some(x=>x.packageId===raw))return scanError('กล่องนี้ถูกสแกนและจับคู่แล้วในรอบปัจจุบัน');
  const result=packById(raw);if(!result)return scanError('ไม่พบ Package ID นี้ในระบบ');
  if(!result.order.paidAt)return scanError('ออร์เดอร์นี้ยังไม่ยืนยันชำระเงิน ไม่สามารถส่งมอบได้');
  if(!result.pkg.labelPrinted)return scanError('กล่องนี้ยังไม่ได้ยืนยันการพิมพ์ใบปะหน้า');
  if(result.pkg.handedAt)return scanError('กล่องนี้ส่งมอบให้ขนส่งไปแล้ว ไม่สามารถส่งซ้ำได้');
  ui.scanStage='tracking';ui.scanCurrent=raw;ui.scanError='';render();toast('พบกล่อง '+raw+' · สแกน Tracking ต่อได้เลย');
 }else{
  if(/^ORD-\d+-P\d{2,}$/.test(raw))return scanError('ลำดับไม่ถูกต้อง · ตอนนี้ต้องสแกน Tracking ขนส่งของกล่องที่เลือกก่อน');
  if(!/^[A-Z0-9-]{7,35}$/.test(raw))return scanError('Tracking ไม่ถูกต้อง · กรอกอักษร/ตัวเลข 7–35 ตัว (อาจมีขีดกลาง)');
  if(ui.scanDraft.some(x=>x.tracking===raw)||db.orders.some(o=>o.packages.some(p=>p.tracking===raw)))return scanError('Tracking Number นี้ถูกใช้กับกล่องอื่นแล้ว ห้ามใช้ซ้ำ');
  const result=packById(ui.scanCurrent);if(!result||result.pkg.handedAt||!result.pkg.labelPrinted)return scanError('กล่องที่เลือกไม่พร้อมส่งมอบ กรุณาเริ่มสแกนใหม่');
  ui.scanDraft.push({orderId:result.order.id,packageId:result.pkg.id,tracking:raw,courier:ui.selectedCourier});
  ui.scanStage='internal';ui.scanCurrent=null;ui.scanError='';render();toast('จับคู่สำเร็จ '+result.pkg.id+' → '+raw);
 }}
function simulateScan(){if(ui.scanStage==='internal'){
 const x=db.orders.flatMap(o=>o.packages.map(p=>({o,p}))).find(({o,p})=>o.paidAt&&p.labelPrinted&&!p.handedAt&&!ui.scanDraft.some(z=>z.packageId===p.id));
 if(!x)return scanError('ไม่มีกล่องที่พร้อมสแกน · ให้ไปยืนยันการพิมพ์ใบปะหน้าใน Admin ก่อน');
 applyScan(x.p.id);
 }else{let track='',k=1;do{track='THDEMO'+String(Date.now()%100000000).padStart(8,'0')+String(k).padStart(3,'0');k++;}while(ui.scanDraft.some(x=>x.tracking===track)||db.orders.some(o=>o.packages.some(p=>p.tracking===track)));applyScan(track);}}
function confirmScan(){if(ui.scanStage==='tracking')return scanError('กรุณาจับคู่ Tracking ของกล่องปัจจุบันให้ครบก่อนยืนยัน');if(!ui.scanDraft.length)return toast('ยังไม่มีคู่บาร์โค้ดที่รอยืนยัน','error');
 for(const d of ui.scanDraft){const x=packById(d.packageId);if(!x||!x.order.paidAt||!x.pkg.labelPrinted||x.pkg.handedAt)return toast('ตรวจสอบไม่ผ่าน: '+d.packageId,'error');if(!d.tracking||!d.courier)return toast('มีคู่ข้อมูลไม่ครบ','error');}
 const n=ui.scanDraft.length;const stamp=new Date().toISOString();for(const d of ui.scanDraft){const {pkg}=packById(d.packageId);pkg.tracking=d.tracking;pkg.courier=d.courier;pkg.handedAt=stamp;}
 const shipped=db.orders.filter(o=>allHanded(o)).length;ui.scanDraft=[];ui.scanCurrent=null;ui.scanStage='internal';ui.scanError='';saveRender('ส่งมอบ '+n+' กล่องเรียบร้อย · ออร์เดอร์ที่ครบทุกกล่องจะเปลี่ยนสถานะโดยอัตโนมัติ');}
function clearScan(){ui.scanDraft=[];ui.scanCurrent=null;ui.scanStage='internal';ui.scanError='';render();toast('ล้างรายการที่รอยืนยันแล้ว · ยังไม่มีการส่งมอบจริง','info');}
function resetDemo(){db=seed();initCustomerBook();ui.sourceFilter='all';ui.customerQuery='';ui.manualCustomer='';ui.role='admin';ui.adminView='dashboard';ui.customerView='home';ui.modal=null;ui.scanDraft=[];ui.scanCurrent=null;ui.scanStage='internal';ui.scanError='';ui.lookupPhone='';ui.lookupSearched=false;ui.lookupExpanded=null;ui.filterOrder='all';ui.orderQuery='';ui.listingCategory='all';ui.listingSearch='';saveRender('รีเซ็ตข้อมูลเดโม่กลับสู่ค่าเริ่มต้นแล้ว',true);}
function onAction(el){const a=el.dataset.a,id=el.dataset.id||null,v=el.dataset.value||null;
 switch(a){
 case'nav':if(el.dataset.view==='new-order')ui.manualCustomer='';nav(el.dataset.role,el.dataset.view);break;
 case'detail':ui.productId=id;ui.detailQty=1;nav('customer','detail');break;
 case'category-go':ui.listingCategory=id;ui.listingSearch='';nav('customer','products');break;
 case'add-cart':{const p=productById(id);if(!p?.active)return toast('สินค้านี้ปิดการขายแล้ว','error');const qty=el.dataset.qty==='detail'?ui.detailQty:1;db.cart[id]=(db.cart[id]||0)+qty;saveRender('เพิ่ม '+p.name+' ลงตะกร้าแล้ว');break;}
 case'detail-qty':ui.detailQty=Math.max(1,Math.min(99,ui.detailQty+Number(el.dataset.delta||0)));render();break;
 case'cart-qty':{db.cart[id]=Math.max(0,Math.min(99,(db.cart[id]||0)+Number(el.dataset.delta||0)));if(db.cart[id]===0)delete db.cart[id];saveRender();break;}
 case'cart-remove':delete db.cart[id];saveRender('ลบสินค้าออกจากตะกร้าแล้ว');break;
 case'lookup-demo':ui.lookupPhone='0812345678';ui.lookupSearched=true;ui.lookupExpanded=null;render();break;
 case'lookup-new':ui.lookupPhone=el.dataset.phone||'';ui.lookupSearched=true;ui.lookupExpanded=null;nav('customer','lookup');break;
 case'lookup-expand':ui.lookupExpanded=ui.lookupExpanded===id?null:id;render();break;
 case'orders-filter':ui.filterOrder=v;nav('admin','orders');break;
 case'open-order':openModal('order',id);break;
 case'new-manual-order':ui.manualCustomer=id||'';nav('admin','new-order');break;
 case'new-customer':openModal('customer-edit');break;
 case'edit-customer':openModal('customer-edit',id);break;
 case'customer-history':openModal('customer-history',id);break;
 case'manual-add-line':document.getElementById('manual-lines').insertAdjacentHTML('beforeend',manualLine());updateManualTotals();break;
 case'manual-remove-line':{const rows=document.querySelectorAll('.manual-line');if(rows.length<=1)return toast('ต้องมีสินค้าอย่างน้อย 1 รายการ','error');el.closest('.manual-line').remove();updateManualTotals();break;}
 case'confirm-payment':confirmPayment(id);break;
 case'save-packages':updatePackages(id);break;
 case'open-label':{const o=orderById(id);if(!o?.paidAt)return toast('ต้องยืนยันการชำระเงินก่อนพิมพ์ใบปะหน้า','error');openModal('label',id,el.dataset.pkg||null);break;}
 case'print-label':window.print();break;
 case'confirm-label':confirmPrinted(id);break;
 case'close-modal':ui.modal=null;render();break;
 case'new-product':openModal('product');break;
 case'edit-product':openModal('product',id);break;
 case'toggle-product':{const p=productById(id);if(p){p.active=!p.active;saveRender(p.active?'เปิดการขายสินค้าแล้ว':'ปิดการขายสินค้าแล้ว');}break;}
 case'delete-product':openModal('delete-product',id);break;
 case'delete-product-now':db.products=db.products.filter(p=>p.id!==id);delete db.cart[id];ui.modal=null;saveRender('ลบสินค้าแล้ว');break;
 case'new-category':openModal('category');break;
 case'edit-category':openModal('category',id);break;
 case'delete-category':{if(db.products.some(p=>p.categoryId===id)){toast('ยังมีสินค้าในหมวดหมู่นี้ กรุณาย้ายสินค้าก่อนลบ','error');return;}openModal('delete-category',id);break;}
 case'delete-category-now':{if(db.products.some(p=>p.categoryId===id))return toast('หมวดหมู่นี้ยังมีสินค้า','error');db.categories=db.categories.filter(c=>c.id!==id);ui.modal=null;saveRender('ลบหมวดหมู่แล้ว');break;}
 case'report-period':ui.reportPeriod=v;render();break;
 case'scan-cancel':ui.scanStage='internal';ui.scanCurrent=null;ui.scanError='';render();break;
 case'demo-scan':simulateScan();break;
 case'scan-remove':ui.scanDraft=ui.scanDraft.filter(x=>x.packageId!==id);render();toast('ลบคู่ข้อมูลที่เลือกจากรอบนี้แล้ว','info');break;
 case'scan-confirm':confirmScan();break;
 case'scan-clear':clearScan();break;
 case'reset-confirm':openModal('reset');break;
 case'reset-now':resetDemo();break;
 default:break;
 }}

async function readImageFile(file){if(!file)return null;if(file.size>1000*1000)throw new Error('ไฟล์ภาพใหญ่เกิน 1 MB กรุณาลดขนาดรูปก่อน');if(!/^image\/(png|jpeg|webp|gif)$/.test(file.type))throw new Error('โปรดเลือกรูป PNG, JPG, WEBP หรือ GIF');return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result));r.onerror=()=>reject(new Error('ไม่สามารถอ่านรูปได้'));r.readAsDataURL(file);});}

  const subtotal=roundMoney(items.reduce((t,x)=>t+x.price*x.qty,0)),shipping=manualShipping(form,items);if(!Number.isFinite(shipping)||shipping<0)return toast('ค่าจัดส่งไม่ถูกต้อง','error');

 if(type==='checkout'){

  saveCustomer(customer);db.orders.push({id,createdAt:new Date().toISOString(),paidAt:null,source:'เว็บไซต์',externalRef:'',paymentMethod:String(fd.get('paymentMethod')||'โอนเงินผ่านธนาคาร'),customer,items,subtotal,shipping,total:subtotal+shipping,note:String(fd.get('note')||'').trim(),packages:[{id:id+'-P01',labelPrinted:false,tracking:null,courier:null,handedAt:null}]});

 if(type==='shipping'){

 }catch(err){toast(err.message||'เกิดข้อผิดพลาดในการบันทึกข้อมูล','error');console.error(err);}

function readCustomer(fd){return Object.fromEntries(['name','phone','address','province','postcode'].map(k=>[k,String(fd.get(k)||'').trim()]));}
function validCustomer(c){return Object.values(c).every(Boolean)&&/^0[0-9]{8,9}$/.test(c.phone)&&/^[0-9]{5}$/.test(c.postcode);}
function customerFields(c={},lock=false){return `<div class="field-grid"><div class="field"><label>ชื่อ–นามสกุลผู้รับ *</label><input name="name" required maxlength="120" value="${esc(c.name||'')}" placeholder="ชื่อผู้รับ"></div><div class="field"><label>เบอร์โทรศัพท์ *</label><input name="phone" required inputmode="numeric" pattern="0[0-9]{8,9}" value="${esc(c.phone||'')}" placeholder="0812345678" ${lock?'readonly':''}></div><div class="field span2"><label>ที่อยู่จัดส่ง *</label><textarea name="address" required maxlength="500" placeholder="บ้านเลขที่ ถนน แขวง/ตำบล เขต/อำเภอ">${esc(c.address||'')}</textarea></div><div class="field"><label>จังหวัด *</label><input name="province" required value="${esc(c.province||'')}"></div><div class="field"><label>รหัสไปรษณีย์ *</label><input name="postcode" required inputmode="numeric" pattern="[0-9]{5}" value="${esc(c.postcode||'')}"></div></div>`;}
function manualLine(){return `<div class="manual-line"><div class="field line-product"><label>สินค้า *</label><select name="product" required><option value="">เลือกสินค้า</option>${db.products.filter(p=>p.active).map(p=>`<option value="${esc(p.id)}">${esc(p.name)} · ${baht(p.price)} / ${esc(p.unit)}</option>`).join('')}</select><div class="tiny muted" data-unit>หน่วย: —</div></div><div class="field"><label>จำนวน *</label><input name="qty" type="number" min="1" max="999999" step="1" value="1" required></div><div class="field"><label>ราคา/หน่วย *</label><input name="price" type="number" min="0" step="0.01" required value="0"></div><div class="line-total"><span class="tiny muted">รวม</span><br><strong data-line-total>฿0</strong></div><button type="button" class="icon-btn" data-a="manual-remove-line" aria-label="ลบรายการสินค้า">${i('trash')}</button></div>`;}
function manualOrderPage(){const c=db.customers.find(x=>x.phone===ui.manualCustomer)||{};return `${adminTitle('สร้างคำสั่งซื้อ','บันทึกออร์เดอร์จากช่องทางอื่นเข้าสู่ระบบเดียวกับเว็บไซต์',`<button class="btn outline" data-a="nav" data-role="admin" data-view="orders">กลับไปคำสั่งซื้อ</button>`)}<form id="manual-order-form" class="manual-order-form stack" data-form="manual-order"><div class="notice blue small">สำหรับข้อมูลจำลองเท่านั้น · ไม่เชื่อมต่อแพลตฟอร์มภายนอกหรือระบบชำระเงินจริง</div><div class="card"><h3 class="card-title">1. ช่องทางการสั่งซื้อ</h3><div class="field-grid"><div class="field"><label>ช่องทาง *</label><select name="source" required>${orderSources.map(x=>`<option ${x==='LINE'?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>เลขออร์เดอร์จากแพลตฟอร์ม (ถ้ามี)</label><input name="externalRef" maxlength="120" placeholder="เช่น SHP-123456"></div></div></div><div class="card"><h3 class="card-title">2. ข้อมูลลูกค้าและที่อยู่จัดส่ง</h3><div class="field" style="margin-bottom:16px"><label>เลือกลูกค้าเดิม (ชื่อหรือเบอร์โทร)</label><select id="manual-customer-select"><option value="">กรอกลูกค้าใหม่</option>${[...db.customers].sort((a,b)=>a.name.localeCompare(b.name,'th')).map(x=>`<option value="${esc(x.phone)}" ${x.phone===c.phone?'selected':''}>${esc(x.name)} · ${esc(x.phone)}</option>`).join('')}</select><div class="tiny muted">ระบบจะบันทึกหรืออัปเดตข้อมูลลูกค้าตามเบอร์โทรเมื่อสร้างออร์เดอร์ โดยไม่แก้ข้อมูลในออร์เดอร์เก่า</div></div>${customerFields(c)}<div class="field mt12"><label>หมายเหตุสำหรับจัดส่ง</label><input name="note" maxlength="300" placeholder="เช่น โทรก่อนส่ง"></div></div><div class="card"><h3 class="card-title">3. รายการสินค้า</h3><div id="manual-lines">${manualLine()}</div><button type="button" class="btn outline mt12" data-a="manual-add-line">${i('plus')} เพิ่มรายการสินค้า</button><div class="small muted mt8">ราคาจะเริ่มจากราคาสินค้าในระบบ สามารถปรับราคาขายตามช่องทางได้</div></div><div class="card"><h3 class="card-title">4. ชำระเงินและเตรียมส่ง</h3><div class="field-grid"><div class="field"><label>สถานะการชำระเงิน</label><select name="paid"><option value="no">รอชำระเงิน</option><option value="yes">ชำระเงินแล้ว</option></select></div><div class="field"><label>วิธีชำระเงิน</label><select name="paymentMethod"><option>โอนเงินผ่านธนาคาร</option><option>พร้อมเพย์</option><option>ชำระผ่านแพลตฟอร์ม</option><option>เงินสด</option><option>อื่น ๆ</option></select></div><div class="field"><label>จำนวนกล่อง *</label><input type="number" name="packageCount" min="1" max="20" step="1" value="1" required></div><div class="field"><label>ค่าจัดส่ง (บาท)</label><input name="shippingOverride" type="number" min="0" step="0.01" placeholder="เว้นว่างเพื่อคำนวณตามร้าน"><div class="tiny muted">ใส่ 0 หากจัดส่งฟรี หรือเว้นว่างเพื่อใช้ค่าจัดส่งที่ตั้งไว้</div></div></div><div class="divider"></div><div id="manual-totals">${moneyLine('ราคาสินค้า',0)}${moneyLine('ค่าจัดส่ง',0)}${moneyLine('รวมทั้งหมด',0,true)}</div><div class="modal-actions"><button type="button" class="btn outline" data-a="nav" data-role="admin" data-view="orders">ยกเลิก</button><button type="submit" class="btn primary">${i('check')} บันทึกคำสั่งซื้อ</button></div></div></form>`;}

function readManualItems(form){return [...form.querySelectorAll('.manual-line')].map(row=>{const p=productById(row.querySelector('[name=product]').value);return {productId:p?.id||'',name:p?.name||'',unit:p?.unit||'',qty:Number(row.querySelector('[name=qty]').value),price:Number(row.querySelector('[name=price]').value)};});}

function customerBookPage(){const q=ui.customerQuery.trim().toLowerCase(),cs=[...db.customers].filter(c=>!q||[c.name,c.phone,c.address,c.province].some(v=>String(v||'').toLowerCase().includes(q))).sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt));return `${adminTitle('ข้อมูลลูกค้า','ค้นหาลูกค้าเดิม บันทึกที่อยู่ และดูประวัติการสั่งซื้อ',`<button class="btn primary" data-a="new-customer">${i('plus')} เพิ่มลูกค้า</button>`)}<div class="notice blue small">สมุดรายชื่อจำลอง · ใช้เบอร์โทรเป็นรหัสอ้างอิงลูกค้า ข้อมูลจากเว็บไซต์และออร์เดอร์ที่ Admin สร้างจะถูกบันทึกอัตโนมัติ</div><div class="table-controls mt18"><form class="searchbox" data-form="customer-search">${i('search')}<input name="q" value="${esc(ui.customerQuery)}" placeholder="ค้นหาชื่อ เบอร์โทร หรือที่อยู่"><button type="submit" class="btn soft sm">ค้นหา</button></form><span class="chip">${cs.length} ลูกค้า</span></div><div class="table-card"><div class="table-wrap"><table class="data-table"><thead><tr><th>ลูกค้า / เบอร์โทร</th><th>ที่อยู่ล่าสุด</th><th>คำสั่งซื้อ</th><th>ยอดชำระสะสม</th><th>จัดการ</th></tr></thead><tbody>${cs.map(c=>{const os=customerOrders(c.phone);return `<tr><td><strong>${esc(c.name)}</strong><div class="small muted">${esc(c.phone)}</div></td><td>${esc(c.address)}<div class="small muted">${esc(c.province)} ${esc(c.postcode)}</div></td><td>${os.length} ออร์เดอร์</td><td>${baht(os.filter(o=>o.paidAt).reduce((a,o)=>a+o.total,0))}</td><td><div class="flex wrap gap6"><button class="btn outline sm" data-a="edit-customer" data-id="${esc(c.phone)}">${i('edit','sm')} แก้ไข</button><button class="btn outline sm" data-a="customer-history" data-id="${esc(c.phone)}">ประวัติ</button><button class="btn soft sm" data-a="new-manual-order" data-id="${esc(c.phone)}">${i('plus','sm')} สร้างออร์เดอร์</button></div></td></tr>`;}).join('')||'<tr><td colspan="5" class="t-center muted">ไม่พบข้อมูลลูกค้า</td></tr>'}</tbody></table></div></div>`;}
function customerEditModal(){const c=db.customers.find(x=>x.phone===ui.modalId);return modalWrap(c?'แก้ไขข้อมูลลูกค้า':'เพิ่มลูกค้า',`<form data-form="customer-edit">${customerFields(c||{},!!c)}<p class="small muted mt12">การแก้ไขที่อยู่นี้ไม่เปลี่ยนข้อมูลบนออร์เดอร์เดิม${c?' · เบอร์โทรหลักของลูกค้าเดิมไม่สามารถแก้ไขในเดโม่นี้':''}</p><div class="modal-actions"><button type="button" class="btn outline" data-a="close-modal">ยกเลิก</button><button type="submit" class="btn primary">บันทึกข้อมูลลูกค้า</button></div></form>`);}
function customerHistoryModal(){const c=db.customers.find(x=>x.phone===ui.modalId);if(!c)return '';const os=customerOrders(c.phone);return modalWrap('ประวัติการสั่งซื้อ · '+esc(c.name),`<div class="small muted">${esc(c.phone)} · ${os.length} คำสั่งซื้อ</div><div class="stack mt18">${os.map(o=>`<div class="shipment-box"><div><strong>${esc(o.id)}</strong><div class="small muted">${dThai(o.createdAt)} · ${esc(o.source)} · ${baht(o.total)}</div>${statusChip(o)}</div><button class="btn outline sm" data-a="open-order" data-id="${esc(o.id)}">รายละเอียด</button></div>`).join('')||'<div class="empty">ยังไม่มีประวัติคำสั่งซื้อ</div>'}</div><div class="modal-actions"><button class="btn primary" data-a="new-manual-order" data-id="${esc(c.phone)}">${i('plus')} สร้างคำสั่งซื้อ</button></div>`,true);}

render();
</script>
</body>
</html>
